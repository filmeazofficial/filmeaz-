<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Featured Films - FILMEAZ</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin-top: 8px;
            color: #ccc;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 30px 15px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .film {
            background: white;
            margin-bottom: 15px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .film h3 {
            margin: 0 0 8px;
        }

        .film h3 a {
            color: #0066cc;
            text-decoration: none;
        }

        .film h3 a:hover {
            text-decoration: underline;
        }

        .film p {
            margin: 5px 0;
            color: #555;
        }

        .loading {
            text-align: center;
            color: #777;
        }

        footer {
            margin-top: 30px;
            background: #111;
            color: #aaa;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>FILMEAZ</h1>
    <p>Films A to Z</p>
</header>

<main>

    <h2>Featured Films</h2>

    <div id="featured-films">
        <p class="loading">Loading featured films...</p>
    </div>

</main>

<footer>
    © 2026 FILMEAZ — Films A to Z
</footer>

<script>
async function loadFeaturedFilms() {

    const featuredFilms =
        document.getElementById("featured-films");

    try {

        const response =
            await fetch("data/movies.json");

        const movies =
            await response.json();

        const featured =
            movies.filter(movie => movie.featured === true);

        featuredFilms.innerHTML = "";

        if (featured.length === 0) {

            featuredFilms.innerHTML =
                "<p>No featured films available.</p>";

            return;
        }

        featured.forEach(movie => {

            const film = document.createElement("div");

            film.className = "film";

            film.innerHTML = `
                <h3>
                    <a href="movie.html?id=${movie.id}">
                        ${movie.title}
                    </a>
                </h3>

                <p><strong>Year:</strong> ${movie.year}</p>

                <p><strong>Language:</strong> ${movie.language}</p>

                <p><strong>Industry:</strong> ${movie.industry}</p>

                <p><strong>Genre:</strong>
                    ${movie.genre.join(", ")}
                </p>
            `;

            featuredFilms.appendChild(film);
        });

    } catch (error) {

        featuredFilms.innerHTML =
            "<p>Unable to load featured films.</p>";

        console.error(error);
    }
}

loadFeaturedFilms();
</script>

</body>
</html>
