<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Person - FILMEAZ</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 22px 15px;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            letter-spacing: 2px;
        }

        header p {
            margin-top: 6px;
            color: #ccc;
        }

        main {
            max-width: 900px;
            margin: auto;
            padding: 30px 15px;
        }

        .profile {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .profile h2 {
            margin-bottom: 15px;
        }

        .profile p {
            margin: 8px 0;
        }

        .filmography {
            margin-top: 30px;
        }

        .filmography h3 {
            margin-bottom: 15px;
        }

        .film {
            background: #f5f5f5;
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 6px;
        }

        .film a {
            color: #222;
            font-weight: bold;
            text-decoration: none;
        }

        .loading {
            text-align: center;
            color: #777;
        }

        footer {
            margin-top: 30px;
            padding: 20px;
            background: #111;
            color: #aaa;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>FILMEAZ</h1>
    <p>Films A to Z</p>
</header>

<main>

    <div id="person-profile">
        <p class="loading">Loading profile...</p>
    </div>

</main>

<footer>
    © 2026 FILMEAZ — Films A to Z
</footer>

<script>
async function loadPerson() {

    const profile = document.getElementById("person-profile");

    try {

        const response = await fetch("data/people.json");
        const people = await response.json();

        const person = people.find(
            item => item.id === "person-001"
        );

        if (!person) {
            profile.innerHTML = "<p>Person not found.</p>";
            return;
        }

        let filmographyHTML = "";

        person.filmography.forEach(film => {
            filmographyHTML += `
                <div class="film">
                    <a href="movie.html?id=${film.movieId}">
                        ${film.movieTitle}
                    </a>
                    <br>
                    Year: ${film.year}
                    <br>
                    Role: ${film.role}
                </div>
            `;
        });

        profile.innerHTML = `
            <div class="profile">

                <h2>${person.name}</h2>

                <p>
                    <strong>Profession:</strong>
                    ${person.profession}
                </p>

                <p>
                    <strong>Known For:</strong>
                    ${person.knownFor.join(", ")}
                </p>

                <div class="filmography">

                    <h3>Filmography</h3>

                    ${filmographyHTML}

                </div>

            </div>
        `;

    } catch (error) {

        profile.innerHTML =
            "<p>Unable to load profile.</p>";

        console.error(error);
    }
}

loadPerson();
</script>

</body>
</html>
