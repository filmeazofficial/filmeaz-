<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actor Profile | FILMEAZ</title><link rel="stylesheet" href="style.css"><style>
main{max-width:1200px;margin:auto;padding:42px 5% 65px}.profile-top{display:grid;grid-template-columns:240px 1fr;gap:32px;align-items:center;padding:28px;border:1px solid var(--border);border-radius:14px;background:var(--bg-card)}.portrait{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#171922;border:1px solid var(--border)}.portrait-fallback{aspect-ratio:3/4;display:grid;place-items:center;background:#171922;color:var(--gold);font:60px Georgia;border-radius:10px}.profile-top h1{font:700 clamp(30px,5vw,48px) Georgia,serif;color:var(--gold-light);margin-bottom:15px}.profile-top p{color:#c4bfb4;line-height:1.8;margin:8px 0}.profile-top strong,.detail-label{color:var(--gold)}.tabs{display:flex;gap:10px;overflow-x:auto;padding:25px 0 15px;border-bottom:1px solid var(--border)}.tab{white-space:nowrap;padding:11px 17px;border:1px solid var(--border);border-radius:25px;background:transparent;color:#cfc7b8;cursor:pointer}.tab.active,.tab:hover{background:var(--gold);color:#111;border-color:var(--gold)}.film-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:20px;padding-top:25px}.film-card{display:block;min-width:0}.film-poster{aspect-ratio:9/16;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#171922}.film-poster img{width:100%;height:100%;object-fit:cover}.film-fallback{height:100%;display:grid;place-items:center;color:var(--gold);font:24px Georgia;text-align:center;padding:8px}.film-card h3{color:var(--white);font-size:14px;line-height:1.5;margin-top:9px}.film-card small{color:var(--gold)}.empty{padding:45px;text-align:center;color:var(--muted);border:1px solid var(--border);border-radius:10px;margin-top:24px}@media(max-width:850px){.film-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:600px){.profile-top{grid-template-columns:115px 1fr;gap:16px;padding:16px}.profile-top h1{font-size:25px}.profile-top p{font-size:12px}.film-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}}@media(max-width:380px){.profile-top{grid-template-columns:1fr}.portrait,.portrait-fallback{max-width:180px}}
</style></head><body><header class="header"><div class="header-container"><a class="logo" href="index.html"><img class="logo-image" src="filmeaz-logo.png" alt="FILMEAZ"></a><button class="menu-toggle" id="menuToggle">☰</button><nav class="navbar" id="navbar"><a class="nav-link" href="index.html">Home</a><a class="nav-link" href="actors.html">Actors</a><a class="nav-link" href="actresses.html">Actresses</a><a class="nav-link" href="about.html">About Us</a></nav><a class="header-search" href="actors.html">⌕</a></div></header><main><div id="profile"><p class="loading-message">Loading profile...</p></div></main><footer class="footer"><div class="container"><div class="footer-bottom"><p>© <span id="year"></span> FILMEAZ — Films A to Z</p><p>Celebrating cinema, one story at a time.</p></div></div></footer>
<script>
(async function(){const root=document.getElementById("profile");const categoryLabel={Film:"Films",Upcoming:"Upcoming Films",Cameo:"Cameo", "Special Appearance":"Special Appearance",Narrator:"Narrator","Voice Over":"Voice Over"};try{const [pr,mr]=await Promise.all([fetch("data/people.json"),fetch("data/movies.json")]);const people=await pr.json(),movies=await mr.json();const id=new URLSearchParams(location.search).get("id");const person=people.find(x=>x.id===id);if(!person){root.innerHTML='<div class="empty">Person profile not found.</div>';return}const photo=person.photo||person.image||person.portrait||person.profileImage;const top=document.createElement("section");top.className="profile-top";const pic=photo?'<img class="portrait" src="'+photo+'" alt="">':'<div class="portrait-fallback">'+(person.name||"").charAt(0)+'</div>';const prof=[].concat(person.professions||person.profession||[]).filter(Boolean).join(", ");const dob=person.dateOfBirth||person.dob||person.birthDate||"";top.innerHTML=pic+'<div><h1>'+esc(person.name||"")+'</h1>'+(dob?'<p><strong>Date of Birth:</strong> '+esc(dob)+'</p>':'')+(prof?'<p><strong>Profession:</strong> '+esc(prof)+'</p>':'')+(person.nationality?'<p><strong>Nationality:</strong> '+esc(person.nationality)+'</p>':'')+(person.biography||person.bio?'<p>'+esc(person.biography||person.bio)+'</p>':'')+'</div>';root.appendChild(top);const filmography=Array.isArray(person.filmography)?person.filmography.slice():[];const upcomingEntries=[...(Array.isArray(person.upcomingFilms)?person.upcomingFilms:[]),...(Array.isArray(person.upcomingFilmography)?person.upcomingFilmography:[])].map(f=>({...f,category:"Upcoming"}));filmography.push(...upcomingEntries);function categoryOf(f){const raw=String(f.category||f.type||"").trim();if(raw)return raw.toLowerCase().replace(/\\b\\w/g,x=>x.toUpperCase());const role=String(f.role||"").toLowerCase();if(role.includes("upcoming"))return "Upcoming";if(role.includes("cameo"))return "Cameo";if(role.includes("special appearance"))return "Special Appearance";if(role.includes("narrator"))return "Narrator";if(role.includes("voice")||role.includes("voice-over")||role.includes("voice over"))return "Voice Over";return "Film"}const grouped=new Map();filmography.forEach(f=>{const key=categoryOf(f);if(!grouped.has(key))grouped.set(key,[]);grouped.get(key).push(f)});const preferred=["Film","Upcoming","Cameo","Special Appearance","Narrator","Voice Over"];const keys=[...preferred.filter(k=>grouped.has(k)),...Array.from(grouped.keys()).filter(k=>!preferred.includes(k)).sort()];const available=keys.map(key=>({label:categoryLabel[key]||key,key,items:grouped.get(key)})).filter(x=>x.items.length);const tabs=document.createElement("div");tabs.className="tabs";const content=document.createElement("div");root.append(tabs,content);function show(item,button){tabs.querySelectorAll("button").forEach(x=>x.classList.remove("active"));button.classList.add("active");content.innerHTML="";const grid=document.createElement("div");grid.className="film-grid";item.items.sort((a,b)=>{const movieA=movies.find(m=>m.id===a.movieId)||{};const movieB=movies.find(m=>m.id===b.movieId)||{};const dateA=movieA.releaseDate||a.releaseDate||"";const dateB=movieB.releaseDate||b.releaseDate||"";const timeA=Date.parse(dateA);const timeB=Date.parse(dateB);const yearA=Number(movieA.year||a.year||0);const yearB=Number(movieB.year||b.year||0);const sortA=Number.isNaN(timeA)?(yearA?Date.UTC(yearA,0,1):0):timeA;const sortB=Number.isNaN(timeB)?(yearB?Date.UTC(yearB,0,1):0):timeB;return sortA-sortB}).forEach(f=>{const movie=movies.find(m=>m.id===f.movieId)||{};const card=document.createElement("a");card.className="film-card";card.href=f.movieId?"movie.html?id="+encodeURIComponent(f.movieId):"#";const poster=movie.poster||movie.posterUrl||f.poster||"";card.innerHTML='<div class="film-poster">'+(poster?'<img src="'+poster+'" alt="">':'<div class="film-fallback">FILMEAZ</div>')+'</div><h3>'+esc(movie.title||f.movieTitle||f.title||"Untitled Film")+'</h3><small>'+esc(movie.year||f.year||"")+'</small>';grid.appendChild(card)});content.appendChild(grid)}available.forEach((item,i)=>{const b=document.createElement("button");b.className="tab"+(i===0?" active":"");b.textContent=item.label;b.addEventListener("click",()=>show(item,b));tabs.appendChild(b);if(i===0)show(item,b)});if(!available.length)content.innerHTML='<div class="empty">Filmography details will appear here when added to the FILMEAZ database.</div>'}catch(e){console.error(e);root.innerHTML='<div class="empty">Unable to load this profile.</div>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}document.getElementById("menuToggle").onclick=()=>document.getElementById("navbar").classList.toggle("active");document.getElementById("year").textContent=new Date().getFullYear()})();
</script></body></html>
