<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movies - FILMEAZ</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 22px 15px;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            letter-spacing: 2px;
        }

        header p {
            margin-top: 6px;
            color: #ccc;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 30px 15px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .movie-card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .movie-card h3 {
            margin-bottom: 10px;
        }

        .movie-card p {
            margin: 6px 0;
            color: #555;
        }

        .loading {
            text-align: center;
            color: #777;
        }

        footer {
            margin-top: 30px;
            padding: 20px;
            background: #111;
            color: #aaa;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>FILMEAZ</h1>
    <p>Films A to Z</p>
</header>

<main>

    <h2>Movies</h2>

    <div id="movies-list">
        <p class="loading">Loading movies...</p>
    </div>

</main>

<footer>
    © 2026 FILMEAZ — Films A to Z
</footer>

<script>
async function loadMovies() {

    const moviesList = document.getElementById("movies-list");

    try {

        const response = await fetch("data/movies.json");
        const movies = await response.json();

        moviesList.innerHTML = "";

        movies.forEach(movie => {

            const movieCard = document.createElement("div");
            movieCard.className = "movie-card";

            movieCard.innerHTML = `
    <h3>
        <a href="movie.html?id=${movie.id}">
            ${movie.title}
        </a>
    </h3>
    <p><strong>Year:</strong> ${movie.year}</p>
    <p><strong>Language:</strong> ${movie.language}</p>
    <p><strong>Industry:</strong> ${movie.industry}</p>
    <p><strong>Genre:</strong> ${movie.genre.join(", ")}</p>
    <p><strong>Directed By:</strong> ${movie.directedBy}</p>
`;

            moviesList.appendChild(movieCard);
        });

    } catch (error) {

        moviesList.innerHTML =
            "<p>Unable to load movies.</p>";

        console.error(error);
    }
}

loadMovies();
</script>

</body>
</html>
