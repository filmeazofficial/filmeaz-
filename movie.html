<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movie Details | FILMEAZ</title><link rel="stylesheet" href="style.css"><style>
main{max-width:1150px;margin:auto;padding:45px 5% 70px}.movie-detail{display:grid;grid-template-columns:300px 1fr;gap:35px;padding:28px;border:1px solid var(--border);border-radius:14px;background:var(--bg-card)}.poster{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:9px;background:#171922;border:1px solid var(--border)}.poster-fallback{aspect-ratio:9/16;display:grid;place-items:center;color:var(--gold);font:30px Georgia;background:#171922}.movie-info h1{font:700 clamp(28px,5vw,46px) Georgia,serif;color:var(--gold-light);margin:8px 0 22px}.movie-info p{color:#d2ccbf;line-height:1.8;margin:10px 0}.movie-info strong{color:var(--gold)}.movie-info a{color:var(--gold-light);text-decoration:underline;text-underline-offset:3px}.cast{margin-top:24px;padding-top:18px;border-top:1px solid var(--border)}.cast h2{color:var(--gold-light);font:24px Georgia;margin-bottom:12px}.cast p{margin:8px 0}.empty{padding:45px;text-align:center;color:var(--muted)}@media(max-width:650px){.movie-detail{grid-template-columns:125px 1fr;gap:16px;padding:15px}.movie-info h1{font-size:25px;margin:5px 0 12px}.movie-info p{font-size:12px;margin:6px 0}}@media(max-width:390px){.movie-detail{grid-template-columns:1fr}.poster,.poster-fallback{max-width:190px}}
</style></head><body><header class="header"><div class="header-container"><a class="logo" href="index.html"><img class="logo-image" src="filmeaz-logo.png" alt="FILMEAZ"></a><button class="menu-toggle" id="menuToggle">☰</button><nav class="navbar" id="navbar"><a class="nav-link" href="index.html">Home</a><a class="nav-link" href="actors.html">Actors</a><a class="nav-link" href="actresses.html">Actresses</a><a class="nav-link" href="about.html">About Us</a></nav><a class="header-search" href="actors.html">⌕</a></div></header><main><div id="movie"><p class="loading-message">Loading movie...</p></div></main><footer class="footer"><div class="container"><div class="footer-bottom"><p>© <span id="year"></span> FILMEAZ — Films A to Z</p><p>Celebrating cinema, one story at a time.</p></div></div></footer>
<script>
(async function(){const root=document.getElementById("movie");try{const [mr,pr]=await Promise.all([fetch("data/movies.json"),fetch("data/people.json")]);const movies=await mr.json(),people=await pr.json();const m=movies.find(x=>x.id===new URLSearchParams(location.search).get("id"));if(!m){root.innerHTML='<div class="empty">Movie not found.</div>';return}const poster=m.poster||m.posterUrl||"";const details=[["Release Date",m.releaseDate||m.release_date],["Language",m.language],["Film Length",m.runtime||m.duration||m.filmLength],["Genre",Array.isArray(m.genre)?m.genre.join(", "):m.genre],["Director",m.director||m.directedBy],["Producer",m.producer||m.producedBy]];let html='<section class="movie-detail"><div>'+(poster?'<img class="poster" src="'+poster+'" alt="">':'<div class="poster-fallback">FILMEAZ</div>')+'</div><div class="movie-info"><h1>'+esc(m.title||"")+'</h1>';details.forEach(d=>{if(d[1])html+='<p><strong>'+d[0]+':</strong> '+esc(d[1])+'</p>'});html+='<div class="cast"><h2>Cast</h2>';(m.cast||[]).forEach(c=>{const p=people.find(x=>x.id===c.personId);html+='<p><a href="person.html?id='+encodeURIComponent(c.personId||"")+'">'+esc(c.name||(p&&p.name)||"Cast Member")+'</a>'+(c.role?' — '+esc(c.role):"")+'</p>'});html+='</div></div></section>';root.innerHTML=html}catch(e){console.error(e);root.innerHTML='<div class="empty">Unable to load movie details.</div>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}document.getElementById("menuToggle").onclick=()=>document.getElementById("navbar").classList.toggle("active");document.getElementById("year").textContent=new Date().getFullYear()})();
</script></body></html>
