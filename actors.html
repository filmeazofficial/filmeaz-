<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Actors - FILMEAZ</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 22px 15px;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            letter-spacing: 2px;
        }

        header p {
            margin-top: 6px;
            color: #ccc;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 30px 15px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .person-card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .person-card h3 {
            margin-bottom: 10px;
        }

        .person-card p {
            margin: 6px 0;
            color: #555;
        }

        .loading {
            text-align: center;
            color: #777;
        }

        footer {
            margin-top: 30px;
            padding: 20px;
            background: #111;
            color: #aaa;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>FILMEAZ</h1>
    <p>Films A to Z</p>
</header>

<main>

    <h2>Actors</h2>

    <div id="actors-list">
        <p class="loading">Loading actors...</p>
    </div>

</main>

<footer>
    © 2026 FILMEAZ — Films A to Z
</footer>

<script>
async function loadActors() {

    const actorsList = document.getElementById("actors-list");

    try {

        const response = await fetch("data/people.json");
        const people = await response.json();

        const actors = people.filter(
            person => person.profession === "Actor"
        );

        actorsList.innerHTML = "";

        actors.forEach(person => {

            const personCard = document.createElement("div");
            personCard.className = "person-card";

            personCard.innerHTML = `
    <h3>
        <a href="person.html?id=${person.id}">
            ${person.name}
        </a>
    </h3>
    <p><strong>Profession:</strong> ${person.profession}</p>
    <p><strong>Known For:</strong> ${person.knownFor.join(", ")}</p>
`;

            actorsList.appendChild(personCard);
        });

    } catch (error) {

        actorsList.innerHTML =
            "<p>Unable to load actors.</p>";

        console.error(error);
    }
}

loadActors();
</script>

</body>
</html>
