<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Genre - FILMEAZ</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 22px 15px;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            letter-spacing: 2px;
        }

        header p {
            margin-top: 6px;
            color: #ccc;
        }

        main {
            max-width: 900px;
            margin: auto;
            padding: 30px 15px;
        }

        h2 {
            margin-bottom: 25px;
        }

        .movie {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .movie h3 {
            margin-bottom: 8px;
        }

        .movie h3 a {
            color: #0066cc;
            text-decoration: none;
        }

        .movie h3 a:hover {
            text-decoration: underline;
        }

        .movie p {
            margin: 6px 0;
            color: #555;
        }

        .loading {
            text-align: center;
            color: #777;
        }

        footer {
            margin-top: 30px;
            padding: 20px;
            background: #111;
            color: #aaa;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>FILMEAZ</h1>
    <p>Films A to Z</p>
</header>

<main>

    <h2 id="genre-title">Loading...</h2>

    <div id="genre-movies">
        <p class="loading">Loading movies...</p>
    </div>

</main>

<footer>
    © 2026 FILMEAZ — Films A to Z
</footer>

<script>
async function loadGenreMovies() {

    const genreTitle =
        document.getElementById("genre-title");

    const genreMovies =
        document.getElementById("genre-movies");

    try {

        const response =
            await fetch("data/movies.json");

        const movies =
            await response.json();

        const params =
            new URLSearchParams(window.location.search);

        const genre =
            params.get("genre");

        if (!genre) {
            genreTitle.textContent = "Genre not specified";
            genreMovies.innerHTML =
                "<p>No genre selected.</p>";
            return;
        }

        genreTitle.textContent =
            genre + " Movies";

        const filteredMovies =
            movies.filter(movie =>
                movie.genre.some(item =>
                    item.toLowerCase() === genre.toLowerCase()
                )
            );

        genreMovies.innerHTML = "";

        if (filteredMovies.length === 0) {

            genreMovies.innerHTML =
                "<p>No movies found for this genre.</p>";

            return;
        }

        filteredMovies.forEach(movie => {

            const movieItem =
                document.createElement("div");

            movieItem.className = "movie";

            movieItem.innerHTML = `
                <h3>
                    <a href="movie.html?id=${movie.id}">
                        ${movie.title}
                    </a>
                </h3>

                <p>
                    <strong>Year:</strong>
                    ${movie.year}
                </p>

                <p>
                    <strong>Language:</strong>
                    ${movie.language}
                </p>
            `;

            genreMovies.appendChild(movieItem);
        });

    } catch (error) {

        genreMovies.innerHTML =
            "<p>Unable to load movies.</p>";

        console.error(error);
    }
}

loadGenreMovies();
</script>

</body>
</html>
