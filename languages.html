<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Browse by Language - FILMEAZ</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin-top: 8px;
            color: #ccc;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 30px 15px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .languages {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }

        .language {
            background: white;
            padding: 18px 10px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            font-weight: bold;
        }

        footer {
            margin-top: 30px;
            background: #111;
            color: #aaa;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>FILMEAZ</h1>
    <p>Films A to Z</p>
</header>

<main>

    <h2>Browse Films by Language</h2>

    <div class="languages">

        <div class="language">Gujarati</div>
        <div class="language">Hindi</div>
        <div class="language">Marathi</div>
        <div class="language">Bengali</div>
        <div class="language">Tamil</div>
        <div class="language">Telugu</div>
        <div class="language">Kannada</div>
        <div class="language">Malayalam</div>
        <div class="language">Punjabi</div>
        <div class="language">Bhojpuri</div>
        <div class="language">English</div>
        <div class="language">Urdu</div>
        <div class="language">Odia</div>
        <div class="language">Assamese</div>
        <div class="language">Nepali</div>
        <div class="language">Konkani</div>

    </div>

</main>

<footer>
    © 2026 FILMEAZ — Films A to Z
</footer>

</body>
</html>
