<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Browse by Year - FILMEAZ</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin-top: 8px;
            color: #ccc;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 30px 15px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .years {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
        }

        .year {
            background: white;
            padding: 18px 10px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            font-weight: bold;
        }

        footer {
            margin-top: 30px;
            background: #111;
            color: #aaa;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>FILMEAZ</h1>
    <p>Films A to Z</p>
</header>

<main>

    <h2>Browse Films by Year</h2>

    <div class="years">

        <div class="year">2026</div>
        <div class="year">2025</div>
        <div class="year">2024</div>
        <div class="year">2023</div>
        <div class="year">2022</div>
        <div class="year">2021</div>
        <div class="year">2020</div>
        <div class="year">2019</div>
        <div class="year">2018</div>
        <div class="year">2017</div>
        <div class="year">2016</div>
        <div class="year">2015</div>
        <div class="year">2014</div>
        <div class="year">2013</div>
        <div class="year">2012</div>
        <div class="year">2011</div>
        <div class="year">2010</div>

    </div>

</main>

<footer>
    © 2026 FILMEAZ — Films A to Z
</footer>

</body>
</html>
